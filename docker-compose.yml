version: '3'

volumes:
  pg_data:
  static_volume:

services:
  db:
    image: postgres:13
    restart: always
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    build: ./backend/
    restart: always
    env_file: .env
    volumes:
      - static_volume:/app/static

  frontend:
    env_file: .env
    build: ./frontend/
    restart: always
    command: cp -r /app/build/. /app/static/frontend/
    volumes:
      - static_volume:/app/static 

  gateway:
    build: ./gateway/
    restart: always
    env_file: .env
    volumes:
      - static_volume:/app/static
    ports:
      - "8000:80"