volumes:
  pg_data_production:
  static_volume:

services:
  db:
    image: postgres:13.10
    restart: always
    env_file: .env
    volumes:
      - pg_data_production:/var/lib/postgresql/data

  backend:
    image: patron047/taski_backend
    restart: always
    env_file: .env
    volumes:
      - static_volume:/app/static

  frontend:
    image: patron047/taski_frontend
    restart: always
    env_file: .env
    command: cp -r /app/build/. /app/static/frontend/
    volumes:
      - static_volume:/app/static

  gateway:
    image: patron047/taski_gateway
    restart: always
    env_file: .env
    volumes:
      - static_volume:/app/static
    ports:
      - "8000:80"